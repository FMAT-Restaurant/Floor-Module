# ==============================================================================
# SonarQube Cloud Configuration (Floor Module Monorepo: API + Web + Shared)
# ==============================================================================

# Clave única y organización en SonarQube Cloud
sonar.organization=fmat-restaurant
sonar.projectKey=FMAT-Restaurant_Floor-Module
sonar.projectName=Floor-Module
sonar.projectVersion=1.0

# Rutas de código fuente a escanear
sonar.sources=apps/api/src,apps/web/src,packages/shared/src

# Rutas donde residen las pruebas
sonar.tests=apps/api/src,apps/api/test,apps/web/src,packages/shared/src

# Patrones para identificar archivos de pruebas unitarias e integración
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusiones del análisis de calidad y cobertura:
# - Las migraciones las genera Prisma (SQL de PostgreSQL con identificadores entre comillas;
#   las reglas SQL de SonarCloud producen falsos positivos).
# - Archivos de arranque, utilidades de test, mocks MSW y artefactos compilados.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/prisma/migrations/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,apps/web/src/main.tsx,apps/web/src/vite-env.d.ts,apps/web/src/test/**,apps/web/src/mocks/**,apps/web/public/**,apps/api/src/main.ts

# Rutas de los reportes LCOV de cobertura generados por Jest y Vitest
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info

# Codificación de caracteres estándar
sonar.sourceEncoding=UTF-8